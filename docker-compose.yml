services:
  # Brokerage Service
  brokerage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brokerage-service
    working_dir: /app
    ports:
      - "8000:8000"  # REST API + WebSocket
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
      # Mode: live, paper, or backtest
      - MODE=${MODE:-backtest}
      - VENUE=${VENUE:-gtrade}
      # Market data: mainnet|testnet (PAPER Freqtrade = mainnet data + paper execution)
      - MARKET_DATA_ENV=${MARKET_DATA_ENV:-mainnet}
      - ENABLE_LIVE_TRADING=${ENABLE_LIVE_TRADING:-0}
      - USE_FAKE_PRICE_FEED=${USE_FAKE_PRICE_FEED:-0}

      # Storage
      - DATAFILES_ROOT=/datafiles
      - CANONICAL_TZ=America/New_York
      - SYMBOLS=${SYMBOLS:-XAUUSD,EURUSD}

      # Backfill
      - BACKFILL_INTERVAL_SECONDS=${BACKFILL_INTERVAL_SECONDS:-600}
      - CORRECTIVE_WINDOW_MINUTES=${CORRECTIVE_WINDOW_MINUTES:-5}

      # API
      - HOST=0.0.0.0
      - PORT=8000
      # Broker URL per tools (freqtrade_runner, ws_soak): des de dins Docker = brokerage:8000
      - BROKER_URL=${BROKER_URL:-http://brokerage:8000}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Lighter (per --venue lighter)
      - LIGHTER_BASE_URL=${LIGHTER_BASE_URL:-}
      - LIGHTER_L1_ADDRESS=${LIGHTER_L1_ADDRESS:-}
      - LIGHTER_L1_PRIVATE_KEY=${LIGHTER_L1_PRIVATE_KEY:-}
      - LIGHTER_ACCOUNT_INDEX=${LIGHTER_ACCOUNT_INDEX:-}
      - LIGHTER_API_KEY_INDEX=${LIGHTER_API_KEY_INDEX:-}
      - LIGHTER_API_PRIVATE_KEY=${LIGHTER_API_PRIVATE_KEY:-}
    volumes:
      - ./datafiles:/datafiles
      - ./logs:/app/logs
      - ./lab/lighter:/app/lab/lighter
      - ./lab/out:/app/lab/out
    networks:
      - trading
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux: connectar al broker via host (localhost:8000)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/broker/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js CLI for gTrade SDK
  gtrade-cli:
    build:
      context: ./lab/node-gtrade
      dockerfile: Dockerfile
    container_name: gtrade-cli
    volumes:
      - ./lab/node-gtrade:/app
    networks:
      - trading
    command: tail -f /dev/null  # Keep alive for testing

  # Lab Lighter (mateix entorn que prod: coverage_probe, fetch_historical_candles)
  lighter-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighter-lab
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATAFILES_ROOT=/datafiles
      - LIGHTER_BASE_URL=${LIGHTER_BASE_URL:-https://mainnet.zklighter.elliot.ai}
      - LIGHTER_MARKET_ID_MAP=${LIGHTER_MARKET_ID_MAP:-}
    volumes:
      - ./datafiles:/datafiles
      - ./lab/lighter:/app/lab/lighter
      - ./lab/out:/app/lab/out
    networks:
      - trading
    command: tail -f /dev/null

  # Python CLI for Ostium SDK (LAB — sempre amb -p lab_ostium per aïllament)
  ostium-cli:
    build:
      context: ./lab/ostium
      dockerfile: Dockerfile
    container_name: ostium-cli
    working_dir: /app
    env_file:
      - .env
    environment:
      - E2E_TESTNET=${E2E_TESTNET:-1}
      - ENABLE_LIVE_TRADING=${ENABLE_LIVE_TRADING:-1}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RPC_URL=${RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
    volumes:
      - ./lab/ostium:/app
    networks:
      - trading
    command: tail -f /dev/null  # Keep alive for testing

  # Redis (optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: brokerage-redis
    ports:
      - "6379:6379"
    networks:
      - trading
    restart: unless-stopped

networks:
  trading:
    driver: bridge
