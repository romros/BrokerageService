# Override per Ostium Data Layer prod v0
# Realtime: Ostium (polling) → candles 1m
# Històric/gaps: Dukascopy (prefetch + repair)
#
# Ús:
#   docker compose -f docker-compose.yml -f deploy/compose/overrides/ostium.yml up -d brokerage
#   ./scripts/run_smoke.sh ostium
#   ./scripts/run_soak.sh 30 ostium
#
# Permisos: user ${DOCKER_UID}:${DOCKER_GID} perquè datafiles/compat_reports/ sigui writable per host
# (run_compat.sh, run_soak post-compat escriuen des de host). Scripts exporten UID/GID.

services:
  brokerage:
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      - DATA_LAYER_ENABLED=1
      - DATA_LAYER_WRITE_MODE=realtime_plus_backfill
      - DATA_LAYER_PREFETCH_MINUTES=${DATA_LAYER_PREFETCH_MINUTES:-120}
      - DATA_LAYER_WRITE_SYMBOLS=${DATA_LAYER_WRITE_SYMBOLS:-EURUSD,GBPUSD}
      - DATA_LAYER_STALE_SECONDS=180
      - DATA_LAYER_GATES_MAX_GAP_S=180
      - DATA_LAYER_GATES_MAX_MISSING_PER_24H=1
      - DATA_LAYER_WARMUP_MINUTES=${DATA_LAYER_WARMUP_MINUTES:-120}
      - DATA_LAYER_STARTUP_GATE=${DATA_LAYER_STARTUP_GATE:-0}
      - OSTIUM_ENABLED=1
      - OSTIUM_SYMBOLS=${OSTIUM_SYMBOLS:-EURUSD,GBPUSD}
      - OSTIUM_QUARANTINE_SYMBOLS=${OSTIUM_QUARANTINE_SYMBOLS:-XAUUSD,XAU}
      - OSTIUM_POLL_S=${OSTIUM_POLL_S:-2}
      - OSTIUM_PRICE_API_BASE=${OSTIUM_PRICE_API_BASE:-https://metadata-backend.ostium.io}
