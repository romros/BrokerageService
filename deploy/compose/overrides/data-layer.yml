# Override per Data Layer prod v0 (prefetch + writer + gates)
#
# Permisos: user ${UID}:${GID} perquè datafiles/ sigui writable per host.
# Scripts exporten UID/GID automàticament.
#
# Ús:
#   docker compose -f docker-compose.yml -f deploy/compose/overrides/data-layer.yml up -d brokerage
#   ./scripts/run_smoke.sh data-layer
#   ./scripts/run_soak.sh 30 data-layer

services:
  brokerage:
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      - DATA_LAYER_ENABLED=1
      - DATA_LAYER_PREFETCH_MINUTES=120
      - DATA_LAYER_WRITE_SYMBOLS=${DATA_LAYER_WRITE_SYMBOLS:-XAUUSD,EURUSD}
      - DATA_LAYER_STALE_SECONDS=180
      - DATA_LAYER_GATES_MAX_GAP_S=180
      - DATA_LAYER_GATES_MAX_MISSING_PER_24H=1
      - DATA_LAYER_STARTUP_GATE=${DATA_LAYER_STARTUP_GATE:-0}
