# Compose scaffold — Split vNext (3 serveis + nginx datalayer proxy)
# Reutilitza mateixa imatge/codi; ports i env diferenciats.
#
# ⚠️ PRODUCCIÓ REALTIME: No aturar ni fer rebuild/restart de realtime_datalayer
#    sense planificar — és crític per capturar canales en temps real (Ostium 24/7).
#    Per canvis de codi: desplegar sense reiniciar realtime_datalayer o en finestra de manteniment.
#
# Arquitectura ports:
#   8081 → datalayer-proxy (nginx) — single-port gateway
#            /realtime/*  → realtime_datalayer:8082  (strip prefix)
#            /data/*      → historical_datalayer:8002 (strip prefix)
#            /trade/*     → trading_service:8010      (strip prefix)
#            /backtests/* → trading_service:8010/api/v1/backtests/* (alias)
#   8082 → realtime_datalayer (intern, no exposat al host)
#   8002 → historical_datalayer (intern, no exposat al host)
#   8010 → trading_service (directe per debug intern)
#   trading_service → REALTIME_DATALAYER_BASE_URL=http://realtime_datalayer:8082
#
# Ús:
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.split.yml config
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.split.yml up -d \
#     datalayer-proxy realtime_datalayer historical_datalayer trading_service
#
# Veure deploy/compose/overrides/README.md i docs/ESTAT.md § Arquitectura split vNext.

services:
  # ─── Nginx reverse proxy (punt d'entrada públic) ───────────────────────────
  datalayer-proxy:
    image: nginx:1.25-alpine
    container_name: datalayer-proxy
    restart: unless-stopped
    ports:
      - "${DATALAYER_PORT:-8081}:8081"
    volumes:
      - ./deploy/nginx/datalayer.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - trading
    depends_on:
      - realtime_datalayer
      - historical_datalayer
      - trading_service

  # ─── Realtime DataLayer (port intern 8082) ─────────────────────────────────
  realtime_datalayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-datalayer
    restart: unless-stopped
    working_dir: /app
    # Port 8082 INTERN: no exposat al host. Accés extern via datalayer-proxy:8081/realtime/*
    # Accés directe des de trading_service: http://realtime_datalayer:8082
    expose:
      - "8082"
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
      - PORT=8082
      - HOST=0.0.0.0
      - MODE=${MODE:-backtest}
      - DATAFILES_ROOT=/datafiles
      - REALTIME_DATALAYER_ROOT=/datafiles/realtime_datalayer
      - REALTIME_CANDLES_MAX_HOURS=${REALTIME_CANDLES_MAX_HOURS:-4320}
      - REALTIME_TICKS_MAX_HOURS=${REALTIME_TICKS_MAX_HOURS:-720}
      - CANONICAL_TZ=America/New_York
      - SYMBOLS=${SYMBOLS:-XAUUSD,EURUSD}
      - DATA_LAYER_ENABLED=1
      - DATA_LAYER_WRITE_MODE=realtime_plus_backfill
      - OSTIUM_ENABLED=1
      - OSTIUM_TICK_RECORDER_ENABLED=1
      - OSTIUM_TICK_RECORDER_OUTDIR=/datafiles/realtime_datalayer/ticks
      - OSTIUM_SYMBOLS=${OSTIUM_SYMBOLS:-EURUSD,GBPUSD}
      - OSTIUM_QUARANTINE_SYMBOLS=${OSTIUM_QUARANTINE_SYMBOLS:-XAUUSD,XAU}
      - BROKER_URL=http://realtime_datalayer:8082
      - SERVICE_ROLE=realtime_datalayer
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./datafiles:/datafiles
      - ./logs:/app/logs
    networks:
      - trading
    command: ["python3", "-m", "uvicorn", "apps.realtime_datalayer.app:app", "--host", "0.0.0.0", "--port", "8082"]

  # ─── Historical DataLayer (port intern 8002) ───────────────────────────────
  historical_datalayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: historical-datalayer
    restart: unless-stopped
    working_dir: /app
    # Port 8002 INTERN: no exposat al host. Accés extern via datalayer-proxy:8081/data/*
    expose:
      - "8002"
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
      - PORT=8002
      - HOST=0.0.0.0
      - MODE=${MODE:-backtest}
      - DATAFILES_ROOT=/datafiles
      - CANONICAL_TZ=America/New_York
      - SYMBOLS=${SYMBOLS:-XAUUSD,EURUSD}
      - DATA_LAYER_ENABLED=1
      - DATA_LAYER_WRITE_MODE=backfill_only
      - OSTIUM_ENABLED=0
      - BROKER_URL=http://historical_datalayer:8002
      - SERVICE_ROLE=historical_datalayer
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # RAW Dukascopy: cron incremental — baixa cada hora els últims 7 dies si falten
      - RAW_SYNC_ENABLED=1
      - RAW_SYNC_INTERVAL_MIN=60
      - RAW_SYNC_TAIL_DAYS=7
      - DUKASCOPY_BACKFILL_MODE=ticks
      # T9.14 cutover: default=ticks (Parquet v2). Rollback: DUKASCOPY_PARQUET_ACTIVE=legacy
      - DUKASCOPY_PARQUET_ACTIVE=ticks
    volumes:
      - ./datafiles:/datafiles
      - ./logs:/app/logs
      - ./lab/out:/app/lab/out
    networks:
      - trading
    command: ["python3", "-m", "uvicorn", "apps.historical_datalayer.app:app", "--host", "0.0.0.0", "--port", "8002"]

  # ─── Trading Service ───────────────────────────────────────────────────────
  trading_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-service-split
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8010:8010"
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
      - PORT=8010
      - HOST=0.0.0.0
      - MODE=${MODE:-paper}
      - VENUE=${VENUE:-paper}
      - DATAFILES_ROOT=/datafiles
      - CANONICAL_TZ=America/New_York
      # Accés directe al realtime (port intern, sense passar pel proxy)
      - BROKER_URL=http://realtime_datalayer:8082
      - REALTIME_DATALAYER_BASE_URL=http://realtime_datalayer:8082
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LIGHTER_BASE_URL=${LIGHTER_BASE_URL:-}
      - LIGHTER_L1_ADDRESS=${LIGHTER_L1_ADDRESS:-}
      - LIGHTER_L1_PRIVATE_KEY=${LIGHTER_L1_PRIVATE_KEY:-}
      - LIGHTER_ACCOUNT_INDEX=${LIGHTER_ACCOUNT_INDEX:-}
      - LIGHTER_API_KEY_INDEX=${LIGHTER_API_KEY_INDEX:-}
      - LIGHTER_API_PRIVATE_KEY=${LIGHTER_API_PRIVATE_KEY:-}
      - SERVICE_ROLE=trading_service
      - QUALITY_GATE_MIN_COMPLETENESS=${QUALITY_GATE_MIN_COMPLETENESS:-0.95}
      - QUALITY_GATE_MAX_FRESHNESS_SEC=${QUALITY_GATE_MAX_FRESHNESS_SEC:-300}
      - QUALITY_GATE_MAX_GAP_S_GATE=${QUALITY_GATE_MAX_GAP_S_GATE:-180}
      - DATA_QUALITY_MAX_MISSING_MINUTES=${DATA_QUALITY_MAX_MISSING_MINUTES:-1}
    volumes:
      - ./datafiles:/datafiles
      - ./logs:/app/logs
    networks:
      - trading
    depends_on:
      - realtime_datalayer
    command: ["python3", "-m", "uvicorn", "apps.trading_service.app:app", "--host", "0.0.0.0", "--port", "8010"]
