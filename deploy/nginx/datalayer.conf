# nginx reverse proxy — datalayer unified port
#
# Exposa port 8081 (host) amb routing per prefix:
#   /realtime/* → realtime_datalayer:8082  (strip prefix)
#   /data/*     → historical_datalayer:8002 (strip prefix)
#   /           → 302 /realtime/ui
#
# El trading_service s'connecta directament a realtime_datalayer:8082
# (no passa per aquest proxy, evita reescriptura de paths).

server {
    listen 8081;
    server_name _;

    # Timeouts raonables per a serveis locals
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Propaga headers originals
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Realtime DataLayer ---
    # /realtime/health  → http://realtime_datalayer:8082/health
    # /realtime/status  → http://realtime_datalayer:8082/status
    # /realtime/symbols → http://realtime_datalayer:8082/symbols
    # /realtime/ui      → http://realtime_datalayer:8082/ui
    location /realtime/ {
        rewrite ^/realtime/(.*) /$1 break;
        proxy_pass http://realtime_datalayer:8082;
    }

    # --- Historical DataLayer ---
    # /data/health           → http://historical_datalayer:8002/health
    # /data/status           → http://historical_datalayer:8002/status
    # /data/ohlcv/{symbol}   → http://historical_datalayer:8002/ohlcv/{symbol}
    # /data/coverage/{symbol}→ http://historical_datalayer:8002/coverage/{symbol}
    location /data/ {
        rewrite ^/data/(.*) /$1 break;
        proxy_pass http://historical_datalayer:8002;
    }

    # --- Root → dashboard realtime ---
    location = / {
        return 302 /realtime/ui;
    }

    # --- Healthcheck del proxy mateix ---
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
